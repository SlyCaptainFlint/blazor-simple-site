<dialog class="lightbox" aria-label="Photograph">
  <div class="lightbox-shell">
    <div class="lightbox-stage">
      <button
        class="lightbox-close icon-button"
        type="button"
        aria-label="Close photograph"
      >
        ×
      </button>
      <button
        class="lightbox-prev icon-button"
        type="button"
        aria-label="Previous photograph"
      >
        ‹
      </button>
      <div class="lightbox-image-wrap">
        <div class="lightbox-loading" aria-hidden="true" hidden>
          <div class="lightbox-preview"></div>
        </div>
      </div>
      <button
        class="lightbox-next icon-button"
        type="button"
        aria-label="Next photograph"
      >
        ›
      </button>
      <div class="lightbox-feedback">
        <p class="lightbox-status" role="status"></p>
        <button class="lightbox-retry text-button" type="button" hidden>
          Try again
        </button>
      </div>
    </div>
  </div>
</dialog>
